# Checks out, generates, and builds fprime-vorago-reference across all
# supported toolchain variants, using the Vorago toolchain container as the
# job's `container:`. The linux-gcc-ut leg builds and runs the unit test suite (fprime-util check);
# the others are build-only - no GDS.
name: Build F´

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      # Some build tooling (e.g. generate_build_info.py) expects a USER
      # environment variable to be set; container jobs don't set one by
      # default. Now it matches the same workaround the manual docker exec flow uses.
      USER: docker
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: va416x0-baremetal
            generate_args: va416x0-baremetal -f
            build_cmd: build va416x0-baremetal
          - toolchain: va416x0-baremetal-nostrb
            generate_args: va416x0-baremetal-nostrb -f
            build_cmd: build va416x0-baremetal-nostrb
          - toolchain: va416x0-baremetal-profiler
            generate_args: va416x0-baremetal-profiler -f
            build_cmd: build va416x0-baremetal-profiler
          - toolchain: linux-gcc-ut
            generate_args: --ut -f
            build_cmd: check

    name: Build (${{ matrix.toolchain }})

    steps:
      - name: Checkout fprime-vorago-reference
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Mark workspace as a safe git directory
        # Needed even under the job-level `container:` key: whatever user
        # context checkout ran under doesn't match the one build steps (e.g.
        # generate_build_info.py's `git branch --show-current` call) run
        # under on this runner's containerized-pod implementation, so git
        # flags the checkout as "dubious ownership" without this.
        run: git config --global --add safe.directory "*"

      - name: Create fprime-venv and install fprime-util/GDS
        # The toolchain image does not ship a pre-built fprime-venv,
        # so build one here.
        run: |
          python3 -m venv fprime-venv
          . ./fprime-venv/bin/activate
          pip install --upgrade pip
          pip install -r lib/fprime/requirements.txt
          pip install -r requirements.txt

      - name: Generate and build
        run: |
          . ./fprime-venv/bin/activate
          fprime-util generate ${{ matrix.generate_args }}
          fprime-util ${{ matrix.build_cmd }}
