[fprime]
project_root: .
framework_path: ./lib/fprime
library_locations: ./lib/fprime-vorago:./lib/fprime-baremetal
default_toolchain: va416x0-baremetal
default_ut_toolchain: linux-gcc
config_directory: ./project-config/
install_destination: ./build-artifacts/
default_cmake_options:  FPRIME_ENABLE_FRAMEWORK_UTS=OFF
                        FPRIME_ENABLE_AUTOCODER_UTS=OFF
                        FPRIME_ENABLE_SERIAL_HUBS=OFF
                        FPRIME_ENABLE_TEXT_LOGGERS=OFF
                        FPRIME_INSTALL_STATIC_LIBRARIES=OFF
                        CMAKE_BUILD_TYPE=Release
